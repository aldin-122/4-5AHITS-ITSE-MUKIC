<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.home %}{{ site.title }}{% else %}{{ page.title }} – {{ site.author }}{% endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230e1621%22/><text x=%2214%22 y=%2268%22 font-family=%22monospace%22 font-weight=%22700%22 font-size=%2254%22 fill=%22%234fd1e8%22>&gt;_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --bg: #0e1621;
      --surface: #152131;
      --surface-2: #1b2a3e;
      --border: #24344a;
      --text: #d6e2f0;
      --muted: #8296ad;
      --accent: #4fd1e8;
      --accent-soft: rgba(79, 209, 232, 0.14);
      --amber: #f2b84b;
      --term: #091019;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --display: "Space Grotesk", -apple-system, "Segoe UI", sans-serif;
      --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 1.0625rem/1.7 var(--body);
      -webkit-font-smoothing: antialiased;
    }
    ::selection { background: var(--accent); color: var(--bg); }
    a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
    a:hover { text-decoration-thickness: 2px; }
    :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; border-radius: 3px; }

    /* ---------- Kopfzeile: Terminal-Prompt als Breadcrumb ---------- */
    #progress {
      position: fixed; top: 0; left: 0; height: 3px; width: 0;
      background: var(--accent); z-index: 20;
    }
    header.top {
      position: sticky; top: 0; z-index: 10;
      background: rgba(14, 22, 33, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }
    header.top nav {
      max-width: 860px; margin: 0 auto;
      padding: 0.85rem 1.5rem;
      font: 0.88rem/1.4 var(--mono);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    header.top a { color: var(--accent); text-decoration: none; }
    header.top a:hover { text-decoration: underline; }
    .user { color: #7ee2a8; }
    .path { color: var(--accent); }
    .sign { color: var(--amber); margin: 0 0.5ch 0 0.2ch; }
    .cmd { color: var(--text); }

    main { max-width: 860px; margin: 0 auto; padding: 2.5rem 1.5rem 6rem; }

    /* ---------- Typografie im Bericht ---------- */
    h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; color: #f1f6fc; scroll-margin-top: 4.5rem; }
    h1 { font-size: clamp(2rem, 5vw, 2.9rem); font-weight: 700; letter-spacing: -0.02em; margin: 0.5rem 0 1.25rem; }
    h2 {
      font-size: 1.6rem; font-weight: 700; margin: 3.2rem 0 1rem;
      padding-top: 1.4rem; border-top: 1px solid var(--border);
    }
    h2::before { content: "## "; color: var(--accent); font-family: var(--mono); font-weight: 400; font-size: 0.8em; }
    h3 { font-size: 1.25rem; font-weight: 500; margin: 2.2rem 0 0.7rem; }
    h3::before { content: "### "; color: var(--muted); font-family: var(--mono); font-weight: 400; font-size: 0.75em; }
    h4 { font-size: 1.05rem; font-weight: 500; margin: 1.8rem 0 0.5rem; color: var(--accent); }
    p, ul, ol { max-width: 72ch; }
    li { margin: 0.2rem 0; }
    li::marker { color: var(--muted); }
    hr { border: none; border-top: 1px dashed var(--border); margin: 2.2rem 0; }
    hr + h2 { border-top: none; padding-top: 0; margin-top: 2.2rem; }
    strong { color: #f1f6fc; }
    blockquote {
      margin: 1.5rem 0; padding: 0.8rem 1.2rem;
      border-left: 3px solid var(--amber); background: var(--surface); border-radius: 0 8px 8px 0;
    }
    blockquote p { margin: 0.3rem 0; }

    /* Metadaten (Name, Datum, Klasse ...) werden per Script zu Badges */
    .meta { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0 0 2rem; padding: 0; list-style: none; max-width: none; }
    .meta li {
      margin: 0; padding: 0.3rem 0.8rem;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.88rem;
    }
    .meta li b { font: 600 0.78rem var(--mono); color: var(--muted); margin-right: 0.45ch; }

    /* Inhaltsverzeichnis direkt nach "Inhaltsverzeichnis"-Überschrift */
    .toc-box {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem 1.4rem 1rem 1.2rem; max-width: 72ch;
    }
    .toc-box ul, .toc-box ol { margin: 0.2rem 0; }
    .toc-box a { color: var(--text); text-decoration: none; }
    .toc-box a:hover { color: var(--accent); }

    /* ---------- Code ---------- */
    code {
      font: 0.88em var(--mono);
      background: var(--surface-2); color: #e7eef7;
      padding: 0.12em 0.4em; border-radius: 4px;
    }
    div.highlighter-rouge, figure.highlight { position: relative; margin: 1.2rem 0 1.6rem; }
    pre {
      position: relative;
      background: var(--term); color: #d8e3ef;
      border: 1px solid var(--border); border-radius: 10px;
      padding: 2.6rem 1.2rem 1.1rem;
      overflow-x: auto; font-size: 0.86rem; line-height: 1.6;
    }
    pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    pre::before {
      content: attr(data-lang);
      position: absolute; top: 0; left: 0; right: 0;
      padding: 0.45rem 1.2rem;
      font: 0.72rem var(--mono); color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .copy-btn {
      position: absolute; top: 0.32rem; right: 0.5rem;
      font: 0.72rem var(--mono); color: var(--muted);
      background: transparent; border: 1px solid var(--border); border-radius: 5px;
      padding: 0.15rem 0.55rem; cursor: pointer;
    }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn.ok { color: #7ee2a8; border-color: #7ee2a8; }
    .highlight .c, .highlight .c1, .highlight .cm, .highlight .cp, .highlight .gp { color: #6b819a; font-style: italic; }
    .highlight .k, .highlight .kd, .highlight .kn, .highlight .kr, .highlight .kc, .highlight .o, .highlight .ow { color: #ff8f8f; }
    .highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .se, .highlight .sh { color: #a8e6a3; }
    .highlight .nv, .highlight .vg, .highlight .vi { color: var(--amber); }
    .highlight .nf, .highlight .nx, .highlight .nb, .highlight .fm { color: var(--accent); }
    .highlight .m, .highlight .mi, .highlight .mf, .highlight .mh { color: #d6a8ff; }
    .highlight .nt { color: #ff8f8f; } .highlight .na { color: var(--amber); }
    .highlight .err { color: inherit; background: none; }

    /* ---------- Bilder, Tabellen ---------- */
    main img {
      max-width: 100%; height: auto; display: inline-block;
      border: 1px solid var(--border); border-radius: 8px; cursor: zoom-in;
    }
    table { border-collapse: collapse; width: 100%; margin: 1.2rem 0; font-size: 0.93rem; display: block; overflow-x: auto; }
    th, td { border: 1px solid var(--border); padding: 0.5rem 0.8rem; text-align: left; vertical-align: top; }
    th { background: var(--surface); font-weight: 600; }

    /* ---------- Startseite ---------- */
    .hero { padding: 2rem 0 1rem; }
    .prompt { font: 0.95rem var(--mono); margin: 0 0 1.2rem; color: var(--muted); }
    .cursor {
      display: inline-block; width: 0.6em; height: 1.1em; margin-left: 0.3ch;
      vertical-align: text-bottom; background: var(--accent);
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .hero h1 { font-size: clamp(2.6rem, 9vw, 4.6rem); margin: 0 0 0.6rem; line-height: 1; }
    .lead { color: var(--muted); font-size: 1.1rem; margin: 0; }

    .klasse { margin-top: 3.5rem; }
    .klasse-titel { border-top: none; padding-top: 0; margin: 0 0 1.2rem; display: flex; align-items: baseline; gap: 0.9rem; }
    .klasse-titel::before { content: "./"; }
    .count { font: 0.8rem var(--mono); color: var(--muted); font-weight: 400; }
    .leer { color: var(--muted); font-style: italic; }

    .timeline { list-style: none; margin: 0; padding: 0 0 0 1.4rem; border-left: 2px solid var(--border); max-width: none; }
    .timeline li { position: relative; margin: 0; }
    .timeline li::before {
      content: ""; position: absolute; left: calc(-1.4rem - 6px); top: 1.15rem;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--bg); border: 2px solid var(--muted);
    }
    .timeline li:first-child::before { border-color: var(--accent); background: var(--accent); }
    .timeline a {
      display: grid; grid-template-columns: 7.5rem 1fr auto; align-items: baseline; gap: 1rem;
      padding: 0.75rem 1rem; margin: 0.15rem 0; border-radius: 8px;
      color: var(--text); text-decoration: none;
    }
    .timeline a:hover { background: var(--surface); }
    .timeline a:hover .titel { color: var(--accent); }
    .timeline time { font: 0.85rem var(--mono); color: var(--amber); }
    .timeline .titel { font-family: var(--display); font-weight: 500; font-size: 1.12rem; }
    .timeline .hinweis { font-size: 0.8rem; color: var(--muted); }

    footer {
      max-width: 860px; margin: 0 auto; padding: 1.5rem 1.5rem 3rem;
      border-top: 1px solid var(--border);
      font: 0.8rem var(--mono); color: var(--muted);
    }

    /* ---------- Buttons & Lightbox ---------- */
    #back-to-top {
      position: fixed; right: 1.4rem; bottom: 1.4rem; z-index: 15;
      width: 46px; height: 46px; border-radius: 10px;
      background: var(--surface); color: var(--accent); border: 1px solid var(--border);
      display: grid; place-items: center; cursor: pointer;
      opacity: 0; pointer-events: none; transform: translateY(8px);
      transition: opacity .2s, transform .2s, border-color .2s;
    }
    #back-to-top.show { opacity: 1; pointer-events: auto; transform: none; }
    #back-to-top:hover { border-color: var(--accent); }
    #lightbox {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; padding: 2rem;
      background: rgba(5, 10, 16, 0.92); cursor: zoom-out;
    }
    #lightbox.show { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }

    @media (max-width: 640px) {
      body { font-size: 1rem; }
      main { padding: 1.8rem 1rem 5rem; }
      header.top nav { padding: 0.75rem 1rem; }
      .timeline a { grid-template-columns: 1fr; gap: 0.1rem; padding: 0.6rem 0.8rem; }
      .timeline li::before { top: 0.95rem; }
      pre { font-size: 0.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .cursor { animation: none; }
      #back-to-top { transition: none; }
    }

    /* Drucken / als PDF speichern: hell und ohne Bedienelemente */
    @media print {
      :root { --bg: #fff; --surface: #f3f5f8; --surface-2: #eef1f5; --border: #cfd6df; --text: #1a1f26; --muted: #5a6573; --accent: #0b6b7a; --term: #f6f8fa; }
      body { background: #fff; color: #1a1f26; font-size: 11pt; }
      h1, h2, h3, h4, strong { color: #000; }
      pre { color: #1a1f26; white-space: pre-wrap; }
      header.top, #progress, #back-to-top, .copy-btn, footer { display: none !important; }
      main { max-width: none; padding: 0; }
      h2, h3 { break-after: avoid; }
      pre, img { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div id="progress" aria-hidden="true"></div>
  <header class="top">
    <nav aria-label="Navigation">
      <span class="user">aldin@htl-braunau</span>:<a class="path" href="{{ '/' | relative_url }}">~/berichte</a>{% unless page.home %}{% if page.klasse %}/<a class="path" href="{{ '/' | relative_url }}#{{ page.klasse | downcase }}">{{ page.klasse }}</a>{% endif %}<span class="sign">$</span><span class="cmd">cat {{ page.name }}</span>{% else %}<span class="sign">$</span>{% endunless %}
    </nav>
  </header>

  <main{% unless page.home %} class="bericht"{% endunless %}>
    {{ content }}
  </main>

  <footer>Aldin Mukic, HTL Braunau – ITSE-Labor</footer>

  <button id="back-to-top" type="button" aria-label="Nach oben">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>
  <div id="lightbox" role="dialog" aria-label="Bildansicht"><img alt=""></div>

  <script>
  (function () {
    var main = document.querySelector('main');

    // 1) Metadaten-Absätze nach der Überschrift ("**Name:** ...") als Badges anzeigen
    var h1 = main.querySelector('.bericht h1');
    if (h1) {
      var items = [], node = h1.nextElementSibling, last = null;
      while (node && node.tagName === 'P' && /^\s*<strong>[^<]{1,20}:<\/strong>/.test(node.innerHTML)) {
        node.innerHTML.split(/<br\s*\/?>/i).forEach(function (part) {
          var m = part.match(/^\s*<strong>([^<]+?):<\/strong>\s*([\s\S]*)$/);
          var value = (m ? m[2] : part).trim();
          if (!value) { if (m) last = m[1]; return; }
          items.push({ label: m ? m[1] : last, value: value });
          if (m) last = m[1];
        });
        var done = node; node = node.nextElementSibling; done.remove();
      }
      if (items.length) {
        var ul = document.createElement('ul');
        ul.className = 'meta';
        items.forEach(function (it) {
          var li = document.createElement('li');
          li.innerHTML = (it.label ? '<b>' + it.label + '</b>' : '') + it.value;
          ul.appendChild(li);
        });
        h1.after(ul);
      }
    }

    // 2) Inhaltsverzeichnis in eine Box packen
    main.querySelectorAll('h2').forEach(function (h) {
      if (!/inhaltsverzeichnis/i.test(h.textContent)) return;
      var list = h.nextElementSibling;
      if (list && (list.tagName === 'OL' || list.tagName === 'UL' || list.tagName === 'P')) {
        var box = document.createElement('nav');
        box.className = 'toc-box';
        box.setAttribute('aria-label', 'Inhaltsverzeichnis');
        list.before(box);
        while (list && list.tagName !== 'HR' && !/^H[1-3]$/.test(list.tagName)) {
          var next = list.nextElementSibling; box.appendChild(list); list = next;
        }
      }
    });

    // 3) Code-Blöcke: Sprache anzeigen + Kopieren-Button
    main.querySelectorAll('pre').forEach(function (pre) {
      var wrap = pre.closest('[class*="language-"]');
      var lang = wrap ? (wrap.className.match(/language-(\S+)/) || [])[1] : '';
      var names = { bash: 'terminal', sh: 'terminal', shell: 'terminal', console: 'terminal', plaintext: 'output', text: 'output' };
      pre.setAttribute('data-lang', names[lang] || lang || 'code');
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'copy-btn'; btn.textContent = 'kopieren';
      btn.addEventListener('click', function () {
        var code = pre.querySelector('code');
        navigator.clipboard.writeText((code || pre).innerText).then(function () {
          btn.textContent = 'kopiert'; btn.classList.add('ok');
          setTimeout(function () { btn.textContent = 'kopieren'; btn.classList.remove('ok'); }, 1500);
        });
      });
      pre.appendChild(btn);
    });

    // 4) Externe Links in neuem Tab
    main.querySelectorAll('a[href^="http"]').forEach(function (a) {
      if (a.host !== location.host) { a.target = '_blank'; a.rel = 'noopener'; }
    });

    // 5) Lesefortschritt + Nach-oben-Button
    var bar = document.getElementById('progress'), top = document.getElementById('back-to-top');
    function onScroll() {
      var h = document.documentElement.scrollHeight - innerHeight;
      bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
      top.classList.toggle('show', scrollY > 500);
    }
    addEventListener('scroll', onScroll, { passive: true }); onScroll();
    top.addEventListener('click', function () { scrollTo({ top: 0 }); });

    // 6) Bilder vergrößern
    var lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img');
    main.querySelectorAll('img').forEach(function (img) {
      img.addEventListener('click', function () { lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('show'); });
    });
    lb.addEventListener('click', function () { lb.classList.remove('show'); });
    addEventListener('keydown', function (e) { if (e.key === 'Escape') lb.classList.remove('show'); });
  })();
  </script>
</body>
</html>
